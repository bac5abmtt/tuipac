<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>—</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Karla:wght@300;400&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #F7F5F2;
      --ink: #111010;
      --mid: #888580;
      --rule: #D9D6D0;
      --serif: 'EB Garamond', Georgia, serif;
      --sans: 'Karla', sans-serif;
      --sidebar: 210px;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
    }

    /* ══════════════════
   SHELL
══════════════════ */
    .shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ══════════════════
   SIDEBAR
══════════════════ */
    .sidebar {
      width: var(--sidebar);
      flex-shrink: 0;
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      padding: 36px 28px;
      height: 100vh;
    }

    .logo {
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      letter-spacing: .02em;
      color: var(--ink);
      text-decoration: none;
      margin-bottom: 52px;
      display: block;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-btn {
      background: none;
      border: none;
      text-align: left;
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--rule);
      cursor: pointer;
      padding: 8px 0 8px 22px;
      transition: color .2s;
      position: relative;
    }

    .nav-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 1px;
      background: var(--ink);
      transition: width .3s;
    }

    .nav-btn.active {
      color: var(--ink);
    }

    .nav-btn.active::before {
      width: 14px;
    }

    .sidebar-foot {
      margin-top: auto;
      font-size: 10px;
      letter-spacing: .06em;
      color: var(--rule);
      line-height: 2;
    }

    /* ══════════════════
   MAIN — panels
══════════════════ */
    .main {
      flex: 1;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }

    .panel.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ── panel header ── */
    .pan-head {
      padding: 0 48px;
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--rule);
    }

    .pan-title {
      font-family: var(--serif);
      font-style: italic;
      font-size: 24px;
      font-weight: 400;
    }

    .pan-count {
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--rule);
    }

    .pan-arrows {
      margin-left: auto;
      display: flex;
      gap: 2px;
    }

    .arr-btn {
      background: none;
      border: 1px solid var(--rule);
      color: var(--mid);
      width: 30px;
      height: 30px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }

    .arr-btn:hover:not(:disabled) {
      border-color: var(--ink);
      color: var(--ink);
    }

    .arr-btn:disabled {
      opacity: .22;
      cursor: default;
    }

    /* ── gallery viewport ── */
    .gallery-vp {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .gallery-strip {
      display: flex;
      align-items: stretch;
      height: 100%;
      gap: 10px;
      padding: 20px 48px;
      will-change: transform;
      transition: transform .48s cubic-bezier(.4, 0, .2, 1);
    }

    .card {
      flex-shrink: 0;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: var(--rule);
    }

    .card img {
      height: 100%;
      width: auto;
      display: block;
      object-fit: cover;
      filter: grayscale(10%);
      transition: transform .65s cubic-bezier(.25, .46, .45, .94), filter .4s;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .card:hover img {
      transform: scale(1.04);
      filter: grayscale(0%);
    }

    .card-cap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 32px 12px 10px;
      background: linear-gradient(transparent, rgba(17, 16, 16, .5));
      opacity: 0;
      transition: opacity .3s;
    }

    .card:hover .card-cap {
      opacity: 1;
    }

    .card-cap span {
      font-family: var(--serif);
      font-style: italic;
      font-size: 12px;
      color: rgba(255, 255, 255, .9);
    }

    .ph {
      flex-shrink: 0;
      height: 100%;
      background: #ECEAE6;
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .4
      }

      50% {
        opacity: .8
      }
    }

    .dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      pointer-events: none;
    }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--rule);
      transition: background .3s, transform .3s;
    }

    .dot.on {
      background: var(--ink);
      transform: scale(1.4);
    }

    /* ══════════════════
   ABOUT PANEL
══════════════════ */
    .about-body {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 48px 64px;
      gap: 64px;
      overflow: hidden;
    }

    .about-photo {
      flex-shrink: 0;
      width: 240px;
      height: 100%;
      max-height: 360px;
      overflow: hidden;
      background: #ECEAE6;
      position: relative;
    }

    .about-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(15%);
      display: block;
    }

    .about-photo-ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .about-photo-ph svg {
      opacity: .18;
    }

    .about-text {
      flex: 1;
    }

    .about-label {
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--rule);
      margin-bottom: 20px;
      display: block;
    }

    .about-name {
      font-family: var(--serif);
      font-size: clamp(32px, 4vw, 52px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -.01em;
      margin-bottom: 24px;
    }

    .about-name em {
      font-style: italic;
      color: var(--mid);
    }

    .about-bio {
      font-size: 14px;
      line-height: 1.85;
      color: #3A3836;
      max-width: 480px;
    }

    .about-bio p+p {
      margin-top: 14px;
    }

    .about-loc {
      margin-top: 28px;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--rule);
    }

    /* ══════════════════
   LIGHTBOX
══════════════════ */
    .lb {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(17, 16, 16, .97);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }

    .lb.on {
      opacity: 1;
      pointer-events: all;
    }

    .lb>img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      filter: grayscale(8%);
      transform: scale(.97);
      transition: transform .35s;
      user-select: none;
      -webkit-user-drag: none;
    }

    .lb.on>img {
      transform: scale(1);
    }

    .lb-x {
      position: absolute;
      top: 24px;
      right: 32px;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .25);
      background: none;
      border: none;
      font-family: var(--sans);
      cursor: pointer;
      transition: color .2s;
      padding: 8px;
    }

    .lb-x:hover {
      color: #fff;
    }

    .lb-cap {
      position: absolute;
      bottom: 28px;
      left: 40px;
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: rgba(255, 255, 255, .28);
    }

    .lb-n {
      position: absolute;
      bottom: 32px;
      right: 40px;
      font-size: 10px;
      letter-spacing: .1em;
      color: rgba(255, 255, 255, .16);
    }

    .lb-prev,
    .lb-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid rgba(255, 255, 255, .1);
      color: rgba(255, 255, 255, .25);
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }

    .lb-prev:hover,
    .lb-next:hover {
      border-color: rgba(255, 255, 255, .4);
      color: #fff;
    }

    .lb-prev {
      left: 20px;
    }

    .lb-next {
      right: 20px;
    }

    /* ══════════════════
   MOBILE ≤ 700px
══════════════════ */
    @media (max-width: 700px) {

      html,
      body {
        overflow: auto;
        height: auto;
      }

      .shell {
        flex-direction: column;
        height: auto;
      }

      .sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--rule);
        padding: 18px 20px 14px;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
      }

      .logo {
        margin-bottom: 0;
        margin-right: auto;
      }

      .nav {
        flex-direction: row;
        margin-left: 12px;
      }

      .nav-btn {
        padding: 5px 10px;
        font-size: 10px;
      }

      .nav-btn::before {
        display: none;
      }

      .nav-btn.active {
        color: var(--ink);
        border-bottom: 1px solid var(--ink);
      }

      .sidebar-foot {
        display: none;
      }

      .main {
        height: auto;
        overflow: visible;
      }

      .panel {
        position: static;
        opacity: 0;
        pointer-events: none;
        height: auto;
        display: none;
      }

      .panel.active {
        opacity: 1;
        pointer-events: all;
        display: flex;
        flex-direction: column;
      }

      .pan-head {
        height: 52px;
        padding: 0 20px;
      }

      .pan-title {
        font-size: 18px;
      }

      .gallery-vp {
        height: 55vw;
      }

      .gallery-strip {
        padding: 10px 20px;
        gap: 8px;
      }

      .dots {
        display: none;
      }

      .about-body {
        flex-direction: column;
        padding: 28px 20px;
        gap: 24px;
        align-items: flex-start;
        overflow: auto;
      }

      .about-photo {
        width: 100%;
        height: 56vw;
        max-height: 260px;
      }

      .about-name {
        font-size: 28px;
      }

      .about-bio {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a class="logo" href="#">tên của bạn</a>
      <nav class="nav">
        <button class="nav-btn active" onclick="sw('tranh', this)">tranh vẽ</button>
        <button class="nav-btn" onclick="sw('doi',   this)">đời sống</button>
        <button class="nav-btn" onclick="sw('about', this)">about</button>
      </nav>
      <div class="sidebar-foot">© 2025<br />Hà Nội</div>
    </aside>

    <main class="main">

      <!-- TRANH VẼ -->
      <div class="panel active" id="panel-tranh">
        <div class="pan-head">
          <h2 class="pan-title">tranh vẽ</h2>
          <span class="pan-count" id="c1"></span>
          <div class="pan-arrows">
            <button class="arr-btn" id="prev1" onclick="move('g1',-1)" disabled>←</button>
            <button class="arr-btn" id="next1" onclick="move('g1', 1)">→</button>
          </div>
        </div>
        <div class="gallery-vp" id="vp1">
          <div class="gallery-strip" id="g1">
            <div class="ph" style="width:180px"></div>
            <div class="ph" style="width:230px"></div>
            <div class="ph" style="width:160px"></div>
            <div class="ph" style="width:270px"></div>
            <div class="ph" style="width:200px"></div>
            <div class="ph" style="width:210px"></div>
          </div>
          <div class="dots" id="dots1"></div>
        </div>
      </div>

      <!-- ĐỜI SỐNG -->
      <div class="panel" id="panel-doi">
        <div class="pan-head">
          <h2 class="pan-title">đời sống</h2>
          <span class="pan-count" id="c2"></span>
          <div class="pan-arrows">
            <button class="arr-btn" id="prev2" onclick="move('g2',-1)" disabled>←</button>
            <button class="arr-btn" id="next2" onclick="move('g2', 1)">→</button>
          </div>
        </div>
        <div class="gallery-vp" id="vp2">
          <div class="gallery-strip" id="g2">
            <div class="ph" style="width:250px"></div>
            <div class="ph" style="width:180px"></div>
            <div class="ph" style="width:290px"></div>
            <div class="ph" style="width:200px"></div>
            <div class="ph" style="width:230px"></div>
            <div class="ph" style="width:170px"></div>
          </div>
          <div class="dots" id="dots2"></div>
        </div>
      </div>

      <!-- ABOUT -->
      <div class="panel" id="panel-about">
        <div class="pan-head">
          <h2 class="pan-title">about</h2>
        </div>
        <div class="about-body">

          <!-- ẢNH — thay src="" bằng link ảnh của bạn -->
          <div class="about-photo">
            <img src="" alt="ảnh của tôi" id="about-img" onerror="this.style.display='none'" />
            <div class="about-photo-ph" id="about-ph">
              <svg width="40" height="50" viewBox="0 0 40 50" fill="none">
                <rect x="2" y="2" width="36" height="46" rx="1" stroke="#7A7A7A" stroke-width=".8" fill="none" />
                <circle cx="20" cy="20" r="8" stroke="#C8C4BC" stroke-width=".7" fill="none" />
                <line x1="8" y1="36" x2="32" y2="36" stroke="#C8C4BC" stroke-width=".5" />
                <line x1="8" y1="41" x2="24" y2="41" stroke="#C8C4BC" stroke-width=".5" />
              </svg>
            </div>
          </div>

          <div class="about-text">
            <span class="about-label">về tôi</span>
            <!-- SỬA tên, bio, vị trí bên dưới -->
            <h2 class="about-name">Tên của<br /><em>bạn.</em></h2>
            <div class="about-bio">
              <p>Viết vài dòng giới thiệu bản thân ở đây — bạn là ai, bạn vẽ vì điều gì, phong cách của bạn hình thành
                như thế nào.</p>
              <p>Đây là nơi để kể câu chuyện của mình một cách tự nhiên, không cần quá chỉn chu.</p>
            </div>
            <p class="about-loc">Hà Nội, Việt Nam</p>
          </div>

        </div>
      </div>

    </main>
  </div>

  <!-- LIGHTBOX -->
  <div class="lb" id="lb">
    <button class="lb-x" onclick="closeLb()">đóng ×</button>
    <img id="lbi" src="" alt="" />
    <p class="lb-cap" id="lbc"></p>
    <p class="lb-n" id="lbn"></p>
    <button class="lb-prev" onclick="lbNav(-1)">←</button>
    <button class="lb-next" onclick="lbNav(1)">→</button>
  </div>

  <script>
    /* ══════════════════════════
       STATE
    ══════════════════════════ */
    const state = {
      g1: { pos: 0, total: 0, items: [] },
      g2: { pos: 0, total: 0, items: [] }
    };

    /* ── SWITCH TAB ── */
    function sw(id, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-' + id).classList.add('active');
      btn.classList.add('active');
      // recalc gallery layout when switching to a gallery tab
      if (id === 'tranh' || id === 'doi') {
        const gid = id === 'tranh' ? 'g1' : 'g2';
        requestAnimationFrame(() => { if (state[gid].total > 0) { buildDots(gid); applyPos(gid); } });
      }
    }

    /* ── VISIBLE COUNT ── */
    function visibleCount(gid) {
      const vp = document.getElementById(gid).closest('.gallery-vp');
      const first = document.getElementById(gid).querySelector('.card');
      if (!first) return 3;
      return Math.max(1, Math.floor((vp.offsetWidth - 96) / (first.offsetWidth + 10)));
    }

    /* ── MOVE ── */
    function move(gid, dir) {
      const s = state[gid];
      const maxPos = Math.max(0, s.total - visibleCount(gid));
      s.pos = Math.min(maxPos, Math.max(0, s.pos + dir));
      applyPos(gid);
    }

    function applyPos(gid) {
      const s = state[gid];
      const strip = document.getElementById(gid);
      const cards = strip.querySelectorAll('.card');
      if (!cards.length) return;

      let offset = 0;
      for (let i = 0; i < s.pos && i < cards.length; i++) {
        offset += cards[i].offsetWidth + 10;
      }
      strip.style.transform = `translateX(-${offset}px)`;

      const idx = gid === 'g1' ? 1 : 2;
      const maxPos = Math.max(0, s.total - visibleCount(gid));
      document.getElementById('prev' + idx).disabled = s.pos <= 0;
      document.getElementById('next' + idx).disabled = s.pos >= maxPos;
      updateDots(gid);
    }

    /* ── DOTS ── */
    function buildDots(gid) {
      const idx = gid === 'g1' ? 1 : 2;
      const container = document.getElementById('dots' + idx);
      const pages = Math.max(1, state[gid].total - visibleCount(gid) + 1);
      container.innerHTML = '';
      for (let i = 0; i < pages; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' on' : '');
        container.appendChild(d);
      }
    }

    function updateDots(gid) {
      const idx = gid === 'g1' ? 1 : 2;
      document.getElementById('dots' + idx).querySelectorAll('.dot')
        .forEach((d, i) => d.classList.toggle('on', i === state[gid].pos));
    }

    /* ── SCROLL WHEEL → cuộn ngang ── */
    document.querySelectorAll('.gallery-vp').forEach(vp => {
      const gid = vp.querySelector('.gallery-strip').id;
      vp.addEventListener('wheel', e => {
        e.preventDefault();
        e.stopPropagation();
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (delta > 15) move(gid, 1);
        else if (delta < -15) move(gid, -1);
      }, { passive: false });
    });

    /* ── TOUCH SWIPE ── */
    document.querySelectorAll('.gallery-vp').forEach(vp => {
      const gid = vp.querySelector('.gallery-strip').id;
      let tx0 = null;
      vp.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; }, { passive: true });
      vp.addEventListener('touchend', e => {
        if (tx0 === null) return;
        const dx = e.changedTouches[0].clientX - tx0;
        if (Math.abs(dx) > 40) move(gid, dx < 0 ? 1 : -1);
        tx0 = null;
      }, { passive: true });
    });

    /* ── LIGHTBOX ── */
    let pool = [], cur = 0;
    function openLb(items, i) {
      pool = items; cur = i; setLb();
      document.getElementById('lb').classList.add('on');
      document.body.style.overflow = 'hidden';
    }
    function setLb() {
      document.getElementById('lbi').src = pool[cur].src;
      document.getElementById('lbc').textContent = pool[cur].title;
      document.getElementById('lbn').textContent = (cur + 1) + ' / ' + pool.length;
    }
    function closeLb() {
      document.getElementById('lb').classList.remove('on');
      document.body.style.overflow = '';
    }
    function lbNav(d) { cur = (cur + d + pool.length) % pool.length; setLb(); }
    document.getElementById('lb').addEventListener('click', e => { if (e.target === e.currentTarget) closeLb(); });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lb').classList.contains('on')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') lbNav(-1);
      if (e.key === 'ArrowRight') lbNav(1);
    });
    let lbTx = null;
    document.getElementById('lb').addEventListener('touchstart', e => { lbTx = e.touches[0].clientX; }, { passive: true });
    document.getElementById('lb').addEventListener('touchend', e => {
      if (lbTx === null) return;
      const dx = e.changedTouches[0].clientX - lbTx;
      if (Math.abs(dx) > 40) lbNav(dx < 0 ? 1 : -1);
      lbTx = null;
    }, { passive: true });

    /* ── RENDER ── */
    function render(gid, cid, items) {
      const strip = document.getElementById(gid);
      document.getElementById(cid).textContent = items.length + ' tác phẩm';
      state[gid] = { pos: 0, total: items.length, items };
      strip.innerHTML = '';
      items.forEach((item, i) => {
        const d = document.createElement('div');
        d.className = 'card';
        d.innerHTML = `<img src="${item.src}" alt="${item.title}" loading="lazy"/>
      <div class="card-cap"><span>${item.title}</span></div>`;
        d.addEventListener('click', () => openLb(items, i));
        strip.appendChild(d);
      });
      requestAnimationFrame(() => requestAnimationFrame(() => {
        buildDots(gid); applyPos(gid);
      }));
    }

    /* ── GOOGLE DRIVE ── */
    const API_KEY = 'NETLIFY_REPLACE_KEY';
    const FOLDER_TRANH = '1GxV_tVPWliZcMsrBnH2m5ILYTcYTTrIq';  // ← Folder ID tranh vẽ
    const FOLDER_DOI = '17C5HVxbTwNmpbkXeOep8-S4JnKrrqw0u';  // ← Folder ID đời sống

    async function fetchFolder(id) {
      if (!id || id.startsWith('PASTE_')) return [];
      const r = await fetch(`https://www.googleapis.com/drive/v3/files?q='${id}'+in+parents+and+mimeType+contains+'image/'&fields=files(id,name)&orderBy=name desc&key=${API_KEY}`);
      const d = await r.json();
      if (d.error) { console.warn(d.error.message); return []; }
      return (d.files || []).map(f => ({
        src: `https://drive.google.com/thumbnail?id=${f.id}&sz=w1200`,
        title: f.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ')
      }));
    }

    async function autoLoad() {
      if (API_KEY === 'PASTE_YOUR_API_KEY_HERE') return;
      const [a, b] = await Promise.all([fetchFolder(FOLDER_TRANH), fetchFolder(FOLDER_DOI)]);
      if (a.length) render('g1', 'c1', a);
      if (b.length) render('g2', 'c2', b);
    }

    autoLoad();

    /* ── RESIZE ── */
    window.addEventListener('resize', () => {
      ['g1', 'g2'].forEach(gid => { if (state[gid].total > 0) { buildDots(gid); applyPos(gid); } });
    });
  </script>
</body>
